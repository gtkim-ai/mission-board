<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f6">
<title>가족</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#eef1f6; --ink:#1D1D1F; --dim:#6E6E73; --line:rgba(255,255,255,.75);
    --shadow:rgba(31,41,55,.10); --hi:rgba(255,255,255,.50);
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
    --tab-h:56px; --rail:84px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;min-height:100dvh}
  html{background:var(--bg)}
  body{
    position:relative;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','SF Pro Text','Noto Sans KR',sans-serif;
    font-weight:400;line-height:1.45;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  a{color:#0A84FF;text-decoration:none}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation}
  .bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(760px 560px at 8% 0%, rgba(255,138,101,0.55), rgba(255,138,101,0) 60%),
      radial-gradient(820px 620px at 95% 10%, rgba(94,151,255,0.55), rgba(94,151,255,0) 60%),
      radial-gradient(900px 700px at 40% 100%, rgba(167,139,250,0.45), rgba(167,139,250,0) 60%),
      radial-gradient(700px 600px at 85% 95%, rgba(52,211,153,0.35), rgba(52,211,153,0) 60%),
      linear-gradient(180deg,#eef1f6,#e7ebf2);
    filter:blur(2px);
  }
  .app{
    position:relative;z-index:1;min-height:100dvh;
    padding:calc(10px + max(12px, var(--safe-t))) calc(16px + var(--safe-r)) calc(var(--tab-h) + 12px + max(12px, var(--safe-b))) calc(16px + var(--safe-l));
    max-width:920px;margin:0 auto;
  }
  @media (max-width:480px){
    .app{padding-top:max(62px, calc(10px + var(--safe-t)));padding-bottom:calc(var(--tab-h) + max(34px, var(--safe-b)));}
  }
  .glass,.card,.tabbar,.rail,.morebox,.gatebox{
    background:#ffffffdb;border:1px solid var(--line);
    box-shadow:0 8px 32px var(--shadow), inset 0 1px 0 var(--hi);
  }
  @supports ((-webkit-backdrop-filter:blur(24px)) or (backdrop-filter:blur(24px))){
    .glass,.card,.tabbar,.rail,.morebox,.gatebox{
      background:rgba(255,255,255,.62);
      -webkit-backdrop-filter:blur(24px) saturate(180%);
      backdrop-filter:blur(24px) saturate(180%);
    }
  }
  .head{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px}
  .head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .kicker{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--dim)}
  h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap}
  .nav{display:flex;align-items:center;gap:6px;width:100%}
  .nav .weeklbl{flex:1}
  .nav button,.iconbtn{
    border:0;background:rgba(255,255,255,.55);border-radius:999px;
    min-height:44px;min-width:44px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--ink);
  }
  .weeklbl{font-size:13px;font-weight:600;color:var(--dim);text-align:center;min-width:118px}
  .card{border-radius:22px;padding:16px 16px 14px;margin-bottom:10px}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:700;white-space:nowrap}
  .grow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kidrow{
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;text-align:left;
    border:0;background:rgba(255,255,255,.45);border-radius:16px;
    min-height:132px;padding:12px 10px;color:inherit;
  }
  .av{
    width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;line-height:1;font-weight:700;
  }
  .av img{width:100%;height:100%;object-fit:cover}
  .av-letter{color:#fff;font-size:17px}
  .av.lg{width:52px;height:52px;font-size:22px}
  .av.lg.av-letter{font-size:22px}
  .av.sm{width:40px;height:40px;font-size:17px}
  .kidmeta{width:100%;min-width:0}
  .kidnm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kidsub{font-size:11px;color:var(--dim);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slots{display:flex;gap:3px;margin-top:6px}
  .slots i{width:14px;height:8px;border-radius:3px;background:rgba(120,120,128,.22);display:block}
  .slots i.on{background:currentColor}
  .mins{font-size:22px;font-weight:700;letter-spacing:-0.03em;line-height:1}
  .mins span{font-size:13px;font-weight:600;color:var(--dim)}
  .mins.none{font-size:18px;color:var(--dim)}
  .hint{margin:8px 0 0;font-size:12px;color:var(--dim)}
  .hline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;min-height:44px}
  .hline .l{font-size:14px}
  .hline .r{font-size:13px;font-weight:600;color:#0A84FF;white-space:nowrap}
  .hline .r.dim{color:var(--dim);font-weight:500}
  .emptyline{
    border-radius:16px;padding:12px 14px;margin-bottom:10px;
    font-size:13px;color:var(--dim);font-weight:600;text-align:center;
  }
  .formula{font-size:13px;color:var(--dim);margin:0 0 12px;line-height:1.5}
  .leftover{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:0;background:rgba(255,255,255,.5);border-radius:14px;
    min-height:52px;padding:10px 12px;margin-bottom:8px;color:inherit;
  }
  .leftover.done{opacity:.45}
  .leftover .box{
    width:28px;height:28px;border-radius:8px;flex:none;
    background:rgba(120,120,128,.14);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:15px;
  }
  .leftover.done .box{background:linear-gradient(160deg,#34D399,#059669)}
  .leftover .txt{flex:1;font-size:15px;font-weight:600}
  .leftover .day{font-size:12px;font-weight:600;color:var(--dim)}
  .daysum{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .daysum div{
    text-align:center;border-radius:12px;padding:8px 2px;background:rgba(255,255,255,.45);
    min-height:52px;
  }
  .daysum b{display:block;font-size:16px;font-weight:700}
  .daysum span{font-size:11px;color:var(--dim)}
  .cta{
    width:100%;min-height:48px;border:0;border-radius:14px;margin-top:8px;
    background:#0A84FF;color:#fff;font-size:15px;font-weight:700;
  }
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;gap:4px;padding:6px 10px calc(6px + max(8px, var(--safe-b)));
    border-radius:0;
  }
  .tabbar button{
    flex:1;border:0;background:transparent;border-radius:12px;
    min-height:44px;padding:4px 4px 6px;font-size:11px;font-weight:600;color:var(--dim);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .tabbar button.on{background:rgba(255,255,255,.92);color:var(--ink);font-weight:700}
  .tabico{font-size:18px;line-height:1;font-weight:400}
  .rail{display:none}
  .morebox{
    display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + var(--safe-b) + 8px);
    z-index:35;border-radius:20px;padding:14px;max-width:520px;margin:0 auto;
  }
  .morebox.on{display:block}
  .morebox button,.morebox .rowbtn{
    width:100%;min-height:44px;border:0;border-radius:12px;margin-bottom:8px;
    background:rgba(255,255,255,.7);font-size:15px;font-weight:600;text-align:left;padding:0 14px;
  }
  .rules label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
  .rules input{
    width:100%;font:inherit;font-size:16px;padding:10px 12px;
    border:1px solid rgba(120,120,128,.22);border-radius:10px;background:rgba(255,255,255,.85);
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{width:auto;min-height:36px;padding:0 10px;margin:0;font-size:13px}
  .chips button.on{background:#1D1D1F;color:#fff}
  .foot{font-size:12px;color:var(--dim);text-align:center;margin:4px 0 8px}
  #gate{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(238,241,246,.72);padding:20px}
  .gatebox{width:100%;max-width:340px;border-radius:24px;padding:22px}
  .gatebox h2{margin:0 0 6px;font-size:22px}
  .gatebox p{margin:0 0 14px;font-size:13px;color:var(--dim)}
  .gatebox label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  .gatebox input{width:100%;font:inherit;font-size:16px;padding:11px 12px;
    border:1px solid rgba(120,120,128,.22);border-radius:12px;background:rgba(255,255,255,.8)}
  .gatebox button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;
    background:#0A84FF;color:#fff;font-size:16px;font-weight:700}
  .gatebox button.sub{background:rgba(255,255,255,.7);color:var(--ink);margin-top:8px}
  #gerr{min-height:18px;margin:10px 0 0;font-size:13px;color:#FF3B30;text-align:center;white-space:pre-line}
  .detail-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .cols{display:flex;flex-direction:column}
  @media (min-width:1100px){
    .app{
      max-width:none;margin:0;
      padding:18px 24px 18px calc(var(--rail) + 24px);
      display:flex;flex-direction:column;min-height:100dvh;
    }
    .tabbar{display:none}
    .rail{
      display:flex;flex-direction:column;align-items:center;gap:10px;
      position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:30;
      padding:calc(16px + var(--safe-t)) 8px calc(16px + var(--safe-b));border-radius:0;
    }
    .av{width:40px;height:40px;font-size:22px}
    .rail button{
      width:64px;min-height:64px;border:0;border-radius:16px;
      background:transparent;font-size:11px;font-weight:700;color:var(--dim);padding:8px 4px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    }
    .rail button.on{background:rgba(255,255,255,.92);color:var(--ink)}
    .home-grid{display:grid;grid-template-columns:660px 1fr;gap:16px;align-items:start}
    .head{flex-direction:row;align-items:flex-end;justify-content:space-between}
    .head-top{flex:none}
    .nav{width:auto}
    .gt-card .grow{gap:10px}
    .gt-card .kidrow{min-height:150px;padding:16px}
    .gt-card .mins{font-size:32px}
    .gt-card .kidnm{font-size:15px}
    .detail-grid{display:grid;grid-template-columns:660px 1fr;gap:16px;align-items:start}
    .morebox{left:calc(var(--rail) + 16px);max-width:420px;bottom:24px}
    h1{font-size:34px}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="game-time.js"></script>
</head>
<body>
<div class="bg"></div>
<nav class="rail glass" id="rail" aria-label="가족 메뉴"></nav>
<div class="app" id="app">
  <div class="head">
    <div class="head-top">
      <div>
        <p class="kicker" id="kicker">가족</p>
        <h1 id="title">가족</h1>
      </div>
      <button type="button" class="iconbtn" id="lock">🔒 잠그기</button>
    </div>
    <div class="nav">
      <button type="button" id="prev" aria-label="이전 주">◀</button>
      <div class="weeklbl" id="range">–</div>
      <button type="button" id="now">이번 주</button>
      <button type="button" id="next" aria-label="다음 주">▶</button>
    </div>
  </div>
  <div id="main"></div>
  <div class="foot"><span id="sync">연결 중…</span></div>
</div>
<nav class="tabbar glass" id="tabbar" aria-label="하단 탭"></nav>
<div class="morebox glass" id="morebox"></div>
<div id="gate">
  <div class="gatebox glass">
    <h2>가족</h2>
    <p>이메일로 로그인하세요</p>
    <label for="gid">이메일</label>
    <input id="gid" type="email" autocomplete="username">
    <label for="gpw">비밀번호</label>
    <input id="gpw" type="password" autocomplete="current-password">
    <button type="button" id="gbtn">로그인</button>
    <button type="button" id="gsignup" class="sub">회원가입</button>
    <p id="gerr"></p>
  </div>
</div>
<script>
(function(){
"use strict";
var SUPABASE_URL = "https://okrzyhcggpjczfjltndf.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rcnp5aGNnZ3BqY3pmamx0bmRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzY2MjAsImV4cCI6MjEwNTIxMjYyMH0.Voee4SJyexgIx7DcZecu2epkZQLytIiN1yrHSQ0GNxo";
var ENGLISH = [
  {id:"en_focus", label:"집중듣기"}, {id:"en_word", label:"단어쓰기"},
  {id:"en_read", label:"낭독영상", subs:[{id:"en_r1",label:"듣기"},{id:"en_r2",label:"듣고 따라읽기"},{id:"en_r3",label:"혼자 읽기"},{id:"en_r4",label:"검사"}]},
  {id:"en_work", label:"문제집 풀기"}, {id:"en_quiz", label:"북퀴즈", weekly:2}
];
var MATH = [{id:"ma_calc", label:"연산 1장"},{id:"ma_class", label:"학교 진도 문제풀이"}];
var HOMERUN = [{id:"hr_day", label:"그날의 학습하기"},{id:"hr_week", label:"오답노트 / 못한 것 하기", weekendOnly:true}];
function groups(extra, engExtra){
  var g = [{name:"큐티", items:[{id:"qt", label:"큐티"}]}];
  if(extra) g.push(extra);
  g.push({name:"영어", items: engExtra ? ENGLISH.concat(engExtra) : ENGLISH});
  g.push({name:"수학", items:MATH});
  g.push({name:"홈런", items:HOMERUN});
  return g;
}
var KIDS = [
  {id:"hajoo", name:"김하주", tone:["#34D399","#059669"],
   groups: groups(null, [{id:"en_class", label:"클래스카드", weekly:3}])},
  {id:"hayoo", name:"김하유", tone:["#5EA1FF","#0A84FF"],
   groups: groups({name:"학교 숙제", items:[{id:"sc_diary",label:"일기",weekly:2},{id:"sc_read",label:"독서 30분 이상"},{id:"sc_log",label:"독서기록장",weekly:1}]})},
  {id:"haseo", name:"김하서", tone:["#FF9F5A","#FF6B35"],
   groups:[{name:"큐티", items:[{id:"qt",label:"큐티"}]},{name:"어린이집", items:[
     {id:"dc_go", label:"어린이집 등원", weekdayOnly:true},{id:"dc_bag", label:"가방·물통 챙기기", weekdayOnly:true},{id:"dc_sleep", label:"낮잠 · 잘 쉬기", weekdayOnly:true}
   ]}]}
];
var DAYN = ["월","화","수","목","금","토","일"];
var HOSPITAL_WEEK = "1970-01-02", MEDICINE_WEEK = "1970-01-03", PACKING_WEEK = "1970-01-04", GROWTH_WEEK = "1970-01-05";
var RULE_WEEK = GameTime.RULE_WEEK;
function fmt(d){ var m=d.getMonth()+1, day=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day; }
function monday(d){ var c=new Date(d.getFullYear(),d.getMonth(),d.getDate()); c.setDate(c.getDate()-((c.getDay()+6)%7)); return c; }
function addDays(d,n){ var c=new Date(d.getFullYear(),d.getMonth(),d.getDate()); c.setDate(c.getDate()+n); return c; }
var TODAY = new Date(), TODAY_KEY = fmt(TODAY);
var weekStart = monday(TODAY);
var data = {}, hospitals = [], medicines = [], packs = [], growth = {profiles:{}, items:[]};
var rules = GameTime.defaultRules();
var sb = null, myEmail = "", allowed = false;
var page = "home", detailId = "", moreOn = false, rulesOn = false;
(function bootKid(){
  var m = location.search.match(/[?&]kid=([^&]+)/);
  if(m){ page = "detail"; detailId = decodeURIComponent(m[1]); }
})();
var saveTimer = null, pending = false, baseData = {};
var weekLoaded = false;
function clone(o){ try{ return JSON.parse(JSON.stringify(o||{})); }catch(e){ return {}; } }
function setBase(){ baseData = clone(data); }
function setSync(msg){ var el=document.getElementById("sync"); if(el) el.textContent = msg; }
function gmsg(t){ document.getElementById("gerr").textContent = t||""; }
function krErr(m){
  m = m||"";
  if(/Invalid login/i.test(m)) return "이메일 또는 비밀번호가 올바르지 않습니다";
  if(/already registered/i.test(m)) return "이미 가입된 이메일입니다. 로그인하세요";
  if(/Password should be at least 6/i.test(m)) return "비밀번호는 6자 이상이어야 합니다";
  if(/Email not confirmed/i.test(m)) return "메일 인증이 아직 안 됐습니다";
  return m;
}
function kidById(id){ for(var i=0;i<KIDS.length;i++) if(KIDS[i].id===id) return KIDS[i]; return KIDS[0]; }
function colorOf(kid){ return (rules.child_master[kid.id] && rules.child_master[kid.id].color) || kid.tone[1]; }
function photoOf(kid){ return (rules.child_master[kid.id] && rules.child_master[kid.id].photo_url) || ""; }
function avatar(kid, cls){
  return GameTime.avatarHTML(kid, rules, {cls: cls || ""});
}
function prettyDate(key){
  if(!key) return "";
  if(key===TODAY_KEY) return "오늘";
  var p = key.split("-"), dt = new Date(+p[0], +p[1]-1, +p[2]);
  return (+p[1])+"/"+ (+p[2])+" ("+["일","월","화","수","목","금","토"][dt.getDay()]+")";
}
function nextHosp(kidId){
  return (hospitals||[]).filter(function(it){ return it.kidId===kidId && (it.date||"")>=TODAY_KEY; })
    .sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); })[0] || null;
}
function lastGrow(kidId){
  return (growth.items||[]).filter(function(x){ return x.kidId===kidId; })
    .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); })[0] || null;
}
function medActive(it, key){ key = key || TODAY_KEY; return (it.start||"") <= key && (!it.end || it.end >= key); }
function todayMeds(){ return (medicines||[]).filter(function(it){ return medActive(it, TODAY_KEY); }); }
function soonPacks(){
  var tom = fmt(addDays(TODAY,1));
  return (packs||[]).filter(function(it){ return it.date===TODAY_KEY || it.date===tom; });
}
function upcomingHosp(){
  return KIDS.map(function(k){ return {kid:k, it:nextHosp(k.id)}; }).filter(function(x){ return !!x.it; });
}
function esc(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]); }); }
function weekLabel(){
  var end = addDays(weekStart,6);
  return (weekStart.getMonth()+1)+"/"+weekStart.getDate()+" – "+(end.getMonth()+1)+"/"+end.getDate();
}
function gt(kid){ return GameTime.compute(kid, data, weekStart, rules, new Date()); }
function maybeFreeze(){
  if(!weekLoaded) return;
  if(!GameTime.isConfirmedTime(weekStart, new Date(), rules.confirm_hour)) return;
  if(data._game && data._game.confirmed) return;
  data._game = GameTime.freezeAll(KIDS, data, weekStart, rules, new Date());
  save();
}
function slotsHtml(g, color){
  var h = '<div class="slots" style="color:'+color+'">';
  for(var i=0;i<g.slots;i++) h += '<i class="'+(i<g.filled?"on":"")+'"></i>';
  return h+"</div>";
}
function kidRow(kid){
  var g = gt(kid), color = colorOf(kid);
  var mins, sub;
  if(g.status==="unregistered"){
    mins = '<div class="mins none">미등록</div>';
    sub = "숙제를 아직 넣지 않았어요";
  } else {

function detailHtml(kid){
  var g = gt(kid), color = colorOf(kid);
  var left = g.leftovers.filter(function(x){ return true; });
  var html = '<div class="detail-grid">';
  html += '<div><section class="card glass"><div class="detail-top">'+avatar(kid,"lg")+'<div><div class="kidnm">'+kid.name+'</div>';
  if(g.status==="unregistered"){
    html += '<div class="mins none">미등록</div></div></div>';
    html += '<p class="formula">계산할 핵심 숙제가 없습니다.</p>';
    html += '<button type="button" class="cta" data-go="board">✏️ 숙제 등록하기</button></section></div>';
  } else {
    html += '<div class="mins">'+g.minutes+"<span>분</span></div></div></div>";
    html += '<p class="formula">'+esc(g.formula)+(g.pendingConfirm?" · 일요일 밤 확정":" · 확정됨")+"</p>";
    html += slotsHtml(g, color);
    html += "</section>";
    html += '<section class="card glass"><h2>✏️ 주중에 못한 숙제</h2>';
    if(!left.length) html += '<p class="hint">남은 핵심 숙제가 없습니다.</p>';
    left.forEach(function(it, idx){
      var day = it.dayIndex>=0 ? DAYN[it.dayIndex]+"요일" : "주간 목표";
      html += '<button type="button" class="leftover" data-lo="'+idx+'">'
        +'<span class="box"></span><span class="txt">'+esc(it.label)+'</span><span class="day">'+day+"</span></button>";
    });
    var doneDays = [];
    for(var i=0;i<5;i++){
      var key = fmt(addDays(weekStart,i));
      var c = data[kid.id] && data[kid.id][key];
      (rules.deduct_target[kid.id]||[]).forEach(function(id){
        var it = GameTime.findItem(kid, id);
        if(!it || it.weekly || it.weekendOnly) return;
        if(c && c.t && (it.subs ? it.subs.every(function(s){ return c.t[s.id]; }) : c.t[it.id])){
          doneDays.push({label:it.label, day:DAYN[i]});
        }
      });
    }
    if(doneDays.length){
      html += '<p class="hint" style="margin-top:12px">끝낸 핵심 숙제</p>';
      doneDays.forEach(function(it){
        html += '<div class="leftover done"><span class="box">✓</span><span class="txt">'+esc(it.label)+'</span><span class="day">'+it.day+"요일</span></div>";
      });
    }
    html += "</section></div>";
  }
  html += '<div><section class="card glass"><h2>📆 이번 주 남긴 개수</h2><div class="daysum">';
  for(var d=0;d<7;d++){
    html += "<div><span>"+DAYN[d]+"</span><b>"+(g.dayCounts[d]||0)+"</b></div>";
  }
  html += "</div></section></div></div>";
  return html;
}

function cacheLocal(){
  try{ localStorage.setItem("mission:"+fmt(weekStart), JSON.stringify(data)); }catch(e){}
}
function loadLocal(){
  try{ var raw=localStorage.getItem("mission:"+fmt(weekStart)); data = raw?JSON.parse(raw):{}; }catch(e){ data={}; }
  if(!data||typeof data!=="object") data={};
  try{ var h=localStorage.getItem("mission:hospital"); var o=h?JSON.parse(h):{items:[]}; hospitals=Array.isArray(o)?o:(o.items||[]); }catch(e){ hospitals=[]; }
  try{ var m=localStorage.getItem("mission:medicine"); var mo=m?JSON.parse(m):{items:[]}; medicines=Array.isArray(mo)?mo:(mo.items||[]); }catch(e){ medicines=[]; }
  try{ var p=localStorage.getItem("mission:packing"); var po=p?JSON.parse(p):{items:[]}; packs=Array.isArray(po)?po:(po.items||[]); }catch(e){ packs=[]; }
  try{ var g=localStorage.getItem("mission:growth"); growth=g?JSON.parse(g):{profiles:{},items:[]}; }catch(e){ growth={profiles:{},items:[]}; }
  try{ var r=localStorage.getItem("mission:rules"); if(r) rules = GameTime.normalizeRules(JSON.parse(r)); }catch(e){}
  setBase();
}
function cacheRules(){ try{ localStorage.setItem("mission:rules", JSON.stringify(rules)); }catch(e){} }
function save(){
  cacheLocal();
  if(!sb || !allowed){ setSync(!sb ? "저장 실패: 연결할 수 없습니다" : "이 기기에만 저장됨"); return; }
  pending = true;
  clearTimeout(saveTimer);
  setSync("저장 중…");
  var savedWeek = fmt(weekStart);
  var snapshot = clone(data);
  var baseSnap = clone(baseData);
  saveTimer = setTimeout(function(){
    sb.from("mission_weeks").select("data").eq("week_start", savedWeek).maybeSingle()
      .then(function(got){
        var remote = (!got.error && got.data && got.data.data) ? got.data.data : {};
        var merged = mergeWeek(baseSnap, snapshot, remote);
        return sb.from("mission_weeks").upsert({
          week_start: savedWeek, data: merged,
          updated_at: new Date().toISOString(), updated_by: myEmail
        }, {onConflict:"week_start"}).then(function(r){
          pending = false;
          if(r.error){ setSync("저장 실패: " + r.error.message); return; }
          if(savedWeek === fmt(weekStart)){ data = merged; setBase(); cacheLocal(); }
          setSync("저장됨 ✔");
        });
      })
      .catch(function(){ pending=false; setSync("저장 실패: 연결할 수 없습니다"); });
  }, 400);
}
function keySet(){
  var s = {};
  for(var i=0;i<arguments.length;i++){
    var o = arguments[i];
    if(!o || typeof o !== "object") continue;
    Object.keys(o).forEach(function(k){ s[k]=true; });
  }
  return Object.keys(s);
}
function mergeDay(base, local, remote){
  base=base||{}; local=local||{}; remote=remote||{};
  var bt=base.t||{}, lt=local.t||{}, rt=remote.t||{};
  var bh=base.h||{}, lh=local.h||{}, rh=remote.h||{};
  var t={}, h={};
  keySet(bt,lt,rt).forEach(function(id){ var lv=!!lt[id], bv=!!bt[id], rv=!!rt[id]; t[id]= lv!==bv ? lv : rv; });
  keySet(bh,lh,rh).forEach(function(id){ var lv=lh[id]||"", bv=bh[id]||"", rv=rh[id]||""; h[id]= lv!==bv ? lv : rv; });
  return {t:t,h:h};
}
function mergeKid(base, local, remote){
  base=base||{}; local=local||{}; remote=remote||{};
  var out={};
  keySet(base,local,remote).forEach(function(k){
    if(k==="_meta"){
      var b=(base._meta&&base._meta.used)||0, l=(local._meta&&local._meta.used)||0, r=(remote._meta&&remote._meta.used)||0;
      out._meta = {used: l!==b ? l : r};
    } else out[k] = mergeDay(base[k], local[k], remote[k]);
  });
  return out;
}
function mergeWeek(base, local, remote){
  base=base||{}; local=local||{}; remote=remote||{};
  var out={};
  keySet(base,local,remote).forEach(function(kid){
    if(kid==="_game") out._game = GameTime.mergeGameLock(base._game, local._game, remote._game);
    else out[kid] = mergeKid(base[kid], local[kid], remote[kid]);
  });
  return out;
}
function saveRules(){
  cacheRules();
  if(!sb || !allowed) return;
  sb.from("mission_weeks").upsert({
    week_start: RULE_WEEK, data: rules,
    updated_at: new Date().toISOString(), updated_by: myEmail
  }, {onConflict:"week_start"}).then(function(r){
    setSync(r.error ? "규칙 저장 실패" : "규칙 저장됨 ✔");
  });
}
function pull(){
  if(!sb || !allowed){ weekLoaded = true; render(); return; }
  setSync("불러오는 중…");
  weekLoaded = false;
  Promise.all([
    sb.from("mission_weeks").select("data").eq("week_start", fmt(weekStart)).maybeSingle(),
    sb.from("mission_weeks").select("data").eq("week_start", HOSPITAL_WEEK).maybeSingle(),
    sb.from("mission_weeks").select("data").eq("week_start", MEDICINE_WEEK).maybeSingle(),
    sb.from("mission_weeks").select("data").eq("week_start", PACKING_WEEK).maybeSingle(),
    sb.from("mission_weeks").select("data").eq("week_start", GROWTH_WEEK).maybeSingle(),
    sb.from("mission_weeks").select("data").eq("week_start", RULE_WEEK).maybeSingle()
  ]).then(function(rs){
    if(rs[0].data && rs[0].data.data) data = rs[0].data.data;
    if(rs[1].data && rs[1].data.data){ var hd=rs[1].data.data; hospitals=Array.isArray(hd)?hd:(hd.items||[]); }
    if(rs[2].data && rs[2].data.data){ var md=rs[2].data.data; medicines=Array.isArray(md)?md:(md.items||[]); }
    if(rs[3].data && rs[3].data.data){ var pd=rs[3].data.data; packs=Array.isArray(pd)?pd:(pd.items||[]); }
    if(rs[4].data && rs[4].data.data) growth = rs[4].data.data;
    if(rs[5].data && rs[5].data.data) rules = GameTime.normalizeRules(rs[5].data.data);
    else saveRules();
    cacheLocal(); cacheRules(); setBase();
    weekLoaded = true;
    render();
    setSync("동기화됨 ✔");
  }).catch(function(){ weekLoaded = true; render(); setSync("저장 실패: 연결할 수 없습니다"); });
}
function shiftWeek(n){
  weekStart = addDays(weekStart, n);
  weekLoaded = false;
  loadLocal(); render(); pull();
}
function showGate(){ document.getElementById("gate").style.display="flex"; }
function hideGate(){ document.getElementById("gate").style.display="none"; }
function onSession(sess){
  if(!sess || !sess.user){ allowed=false; myEmail=""; showGate(); setSync("로그인이 필요합니다"); return; }
  myEmail = sess.user.email||"";
  sb.from("allowed_users").select("email").eq("email", myEmail).maybeSingle().then(function(r){
    if(r.error || !r.data){ allowed=false; showGate(); gmsg("이 계정은 아직 승인되지 않았습니다"); return; }
    allowed=true; hideGate(); loadLocal(); render(); pull();
  });
}

document.getElementById("gpw").addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("gbtn").click(); });
(function swipe(){
  var x0=null;
  document.getElementById("app").addEventListener("touchstart", function(e){ x0 = e.changedTouches[0].clientX; }, {passive:true});
  document.getElementById("app").addEventListener("touchend", function(e){
    if(x0==null) return;
    var dx = e.changedTouches[0].clientX - x0; x0=null;
    if(Math.abs(dx)<60) return;
    shiftWeek(dx>0 ? -7 : 7);
  }, {passive:true});
})();
loadLocal(); render(); showGate();
if(!window.supabase){ gmsg("연결할 수 없습니다"); setSync("저장 실패: 연결할 수 없습니다"); }
else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(function(_e, sess){ onSession(sess); });
}
})();
