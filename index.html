<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미션보드">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f6">
<title>하주 · 하유 · 하서 미션 보드</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=4">
<style>
:root{
  --bg:#eef1f6; --panel:rgba(255,255,255,.62); --panel2:rgba(255,255,255,.55);
  --ink:#1D1D1F; --dim:#6E6E73; --line:rgba(255,255,255,.75);
  --grass:#059669; --grass-lt:#34D399; --dirt:#0A84FF; --dirt-dk:#0055D4;
  --stone:#C7C7CC; --gold:#FF9F0A; --dia:#0A84FF; --red:#FF3B30;
  --shadow:rgba(31,41,55,.10); --hi:rgba(255,255,255,.50);
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  --tab-h:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;min-height:100dvh}
html{background:#eef1f6}
body{
  position:relative; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','SF Pro Text','Noto Sans KR',sans-serif;
  font-weight:400; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(760px 560px at 8% 0%, rgba(255,138,101,0.55), rgba(255,138,101,0) 60%),
    radial-gradient(820px 620px at 95% 10%, rgba(94,151,255,0.55), rgba(94,151,255,0) 60%),
    radial-gradient(900px 700px at 40% 100%, rgba(167,139,250,0.45), rgba(167,139,250,0) 60%),
    radial-gradient(700px 600px at 85% 95%, rgba(52,211,153,0.35), rgba(52,211,153,0) 60%),
    linear-gradient(180deg,#eef1f6,#e7ebf2);
  filter:blur(2px);
}
.wrap{
  position:relative;z-index:1;box-sizing:border-box;
  min-height:100dvh;max-width:920px;margin:0 auto;
  padding:calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) calc(var(--tab-h) + 20px + var(--safe-b)) calc(16px + var(--safe-l));
}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;gap:4px;padding:6px 10px calc(6px + var(--safe-b));
  background:#ffffffdb;border:1px solid rgba(255,255,255,.75);
  box-shadow:0 -8px 24px var(--shadow);
}
@supports ((-webkit-backdrop-filter:blur(24px)) or (backdrop-filter:blur(24px))){
  .tabbar{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
}
.tabbar button{
  flex:1;border:0;background:transparent;border-radius:12px;
  min-height:44px;padding:4px 4px 6px;font-size:11px;font-weight:600;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.tabbar button.on{background:rgba(255,255,255,.92);color:var(--ink);font-weight:700}
.tabico{font-size:18px;line-height:1;font-weight:400}
button,.task,.sub,.habit .st{touch-action:manipulation; -webkit-user-select:none; user-select:none}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em}
img,svg{max-width:100%;display:block}
a{color:#0A84FF;text-decoration:none}

.glass,.card,.gatebox,.views,.tabs,.weeknav .label,.task,.sub,.habit,.wk,.rptrow,.sev,.gchip{
  background:#ffffffdb;border:1px solid rgba(255,255,255,.75);
  box-shadow:0 8px 32px var(--shadow), inset 0 1px 0 var(--hi);
}
@supports ((-webkit-backdrop-filter:blur(24px)) or (backdrop-filter:blur(24px))){
  .glass,.card,.gatebox,.views,.tabs,.weeknav .label,.task,.sub,.habit,.wk,.rptrow,.sev,.gchip{
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
  }
}

.card{border-radius:24px;margin-bottom:12px;overflow:hidden;box-shadow:0 8px 32px var(--shadow), inset 0 1px 0 var(--hi)}
.card > .head{
  padding:16px 18px 0;font-size:17px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;gap:8px;background:transparent;border:0;box-shadow:none
}
.card > button.head{padding:16px 18px}
.card > .body{padding:14px 18px 18px}
.card > .head + .body{padding-top:12px}

header{margin-bottom:14px}
header .inner{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
header .kicker{font-size:14px;color:var(--dim);font-weight:500;margin:0 0 4px}
#hdrAvatar{display:flex;gap:6px;flex:none}
#hdrAvatar .av{width:32px;height:32px;font-size:18px}
.av{
  width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;font-weight:700;vertical-align:middle;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-letter{color:#fff;font-size:14px}

button{
  font-family:inherit;font-weight:600;color:var(--ink);cursor:pointer;
  background:rgba(255,255,255,.55);border:0;border-radius:999px;
  padding:8px 14px;font-size:14px;min-height:44px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
button:active{opacity:.72}
button.on{background:#1D1D1F;color:#fff;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

.views{
  display:flex;gap:2px;padding:4px;border-radius:14px;margin-bottom:10px;
  box-shadow:0 8px 24px var(--shadow), inset 0 1px 0 var(--hi)
}
.views button{
  flex:1;min-width:0;border-radius:10px;min-height:44px;padding:8px 2px;
  font-size:14px;font-weight:500;color:var(--dim);background:transparent;box-shadow:none
}
.views button.on{background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.tabs{
  display:flex;flex-wrap:nowrap;gap:6px;margin-bottom:10px;padding:4px;border-radius:16px;
  box-shadow:0 8px 24px var(--shadow), inset 0 1px 0 var(--hi)
}
.tabs button{
  flex:1;min-width:0;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 6px;border-radius:12px;background:transparent;box-shadow:none;color:var(--dim)
}
.tabs button.on{background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs svg{width:26px;height:26px;flex:none;border-radius:50%}

.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.weeknav .label{
  flex:1;text-align:center;font-size:15px;font-weight:700;border-radius:14px;padding:10px 8px
}
.weeknav button{min-height:44px;min-width:48px;font-size:15px}

.days{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;
  position:sticky;top:var(--safe-t);z-index:20;
  padding:6px 0 8px;
  background:linear-gradient(180deg, rgba(238,241,246,.92), rgba(238,241,246,.72) 70%, transparent)
}
.days button{
  padding:8px 1px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;
  line-height:1.1;min-height:58px;justify-content:center;border-radius:14px
}
.days button .d{font-size:15px;font-weight:700}
.days button.sel{background:#1D1D1F;color:#fff}
.days button.today{box-shadow:inset 0 0 0 2px #0A84FF}
.days .dot{width:7px;height:7px;border-radius:50%;background:var(--stone);border:0}
.days .dot.done{background:var(--grass)}
.days .dot.part{background:#0A84FF}
.days button.wk .d{color:#FF9F0A}
.days button.sel .d{color:#fff}

.grp{margin-bottom:12px}
.grp h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:8px}
.grp h3::before{content:"";width:8px;height:8px;border-radius:3px;background:#0A84FF;border:0}
.task{
  display:flex;align-items:center;gap:12px;padding:13px 16px;margin-bottom:8px;
  cursor:pointer;user-select:none;min-height:52px;border-radius:16px
}
.task.done{background:rgba(5,150,105,.12)}
.task .box{
  width:28px;height:28px;flex:none;border-radius:8px;
  background:rgba(120,120,128,.12);border:0;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:none
}
.task.done .box{background:linear-gradient(160deg,#34D399,#059669)}
.task .txt{flex:1;font-size:15px;font-weight:500}
.task .tag{font-size:11px;font-weight:600;background:rgba(10,132,255,.12);color:#0A84FF;border:0;border-radius:999px;padding:3px 8px;white-space:nowrap}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 10px 8px}
.subs .sub{
  display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:13.5px;
  cursor:pointer;min-height:44px;border-radius:14px
}
.subs .sub.done{background:rgba(5,150,105,.12)}
.subs .sub .box{width:18px;height:18px;border-radius:6px;font-size:11px}

.habit{
  display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;
  min-height:56px;border-radius:16px
}
.habit .txt{flex:1;font-size:15px;font-weight:500}
.habit .st{
  width:56px;height:44px;flex:none;font-size:18px;font-weight:700;padding:0;border-radius:12px
}
.habit .st[data-v="ok"]{background:#059669;color:#fff}
.habit .st[data-v="no"]{background:#FF3B30;color:#fff}
.note{font-size:13px;color:var(--dim);margin:8px 0 0}

.bank{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blocks{display:flex;gap:6px}
.blocks i{
  width:34px;height:34px;display:block;border:0;border-radius:10px;
  background:linear-gradient(160deg,#5EA1FF,#0A84FF);box-shadow:none
}
.blocks i.gone{background:rgba(120,120,128,.22);opacity:.7}
.big{font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;margin-top:10px}
.stat b{font-weight:700}
.bar{height:6px;background:rgba(120,120,128,.16);border:0;border-radius:6px;margin-top:8px;position:relative;overflow:hidden}
.bar > span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#34D399,#059669)}
.ok-badge{
  font-size:13px;font-weight:700;padding:6px 10px;border:0;border-radius:999px;
  background:#d1fae5;color:#059669;box-shadow:none
}
.ok-badge.no{background:rgba(60,60,67,.08);color:var(--dim)}
.wk{
  display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;
  padding:10px 12px;margin-bottom:6px;border-radius:14px
}
.wk .cnt{font-size:16px;font-weight:700}
.wk .cnt.ok{color:#059669}
button.rpthead{
  width:100%;display:flex;align-items:center;gap:8px;text-align:left;
  background:transparent;color:var(--ink);padding:16px 18px;font-size:16px;
  font-weight:700;min-height:48px;border-radius:0;box-shadow:none
}
button.rpthead:active{opacity:.7}
.rptsum{flex:1;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:600}
.rptchip{background:rgba(60,60,67,.08);border:0;border-radius:999px;padding:3px 8px;color:var(--dim);white-space:nowrap}
.rptchip.ok{background:#d1fae5;color:#059669}
.rptchev{flex:none;font-size:12px;opacity:.55}
.rptlist{display:flex;flex-direction:column;gap:6px}
.rptrow{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:44px;font-size:13px;cursor:pointer;border-radius:14px}
.rptrow .nm{flex:1;min-width:0}
.rptrow .ok-badge{font-size:12px;padding:4px 8px;white-space:nowrap}

footer{font-size:12px;color:var(--dim);text-align:center;margin:16px 0 4px}
#sync,#who{font-size:12px;color:var(--dim)}
#who{margin-right:8px}
#appBar,#moreBar{margin-bottom:10px}
#appBar button,#moreBar button{min-height:44px}

#gate{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(238,241,246,.72);padding:20px;
  padding-top:calc(20px + var(--safe-t));padding-bottom:calc(20px + var(--safe-b))
}
.gatebox{width:100%;max-width:340px;border-radius:24px;padding:22px;box-shadow:0 8px 32px var(--shadow)}
.gatebox .gtitle{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.gatebox .gsub{font-size:13px;color:var(--dim);text-align:center;margin-bottom:14px}
.gatebox label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.gatebox input{
  width:100%;font-family:inherit;font-weight:500;font-size:16px;padding:12px;
  background:rgba(255,255,255,.8);color:var(--ink);
  border:1px solid rgba(120,120,128,.22);border-radius:12px;box-shadow:none
}
.gatebox button{width:100%;margin-top:14px;padding:13px;font-size:16px;background:#0A84FF;color:#fff;border-radius:12px}
.gatebox button.sub{background:rgba(255,255,255,.7);color:var(--ink);margin-top:8px}
.gatebox p{min-height:18px;margin:10px 0 0;font-size:13px;color:var(--red);text-align:center;line-height:1.4;white-space:pre-line}

.wkend{
  background:rgba(255,159,10,.14);color:#9A5B00;border:0;border-radius:16px;padding:12px 14px;
  margin-bottom:10px;font-size:14px;line-height:1.4
}
.usebtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.usebtns button{flex:1;min-height:44px}
.addbtn{width:100%;min-height:48px;margin-bottom:10px;background:#0A84FF;color:#fff;border-radius:16px;font-size:15px}

.sev{display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px;padding:12px 14px;margin-bottom:8px;min-height:52px;border-radius:16px}
.sev .doses{flex-basis:100%;margin-top:0}
.sev .when{width:72px;flex:none;font-size:12px;color:var(--dim);line-height:1.3}
.sev .ttl{flex:1;font-size:15px;font-weight:500}
.sev .kd{font-size:11px;font-weight:600;border:0;border-radius:999px;padding:3px 8px;white-space:nowrap}
.sev .kd.school{background:#d1fae5;color:#059669}
.sev .kd.academy{background:#dbeafe;color:#0A84FF}
.sev .kd.other{background:rgba(120,120,128,.12);color:#3A3A3C}
.sev .kd.daycare{background:#ffe8d6;color:#C93400}
.sgrid{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;align-items:stretch;font-size:11px}
.sgrid b{display:flex;align-items:center;justify-content:center;padding:6px 0;font-size:12px;font-weight:700}
.sgrid .scell{min-height:44px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);border-radius:10px;padding:3px 2px;line-height:1.25}
.sgrid .scell.on{outline:2px solid #0A84FF;outline-offset:-2px}
.schip{display:block;margin:0 0 3px;padding:2px 4px;border:0;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schip.school{background:#d1fae5;color:#059669}
.schip.academy{background:#dbeafe;color:#0A84FF}
.schip.other{background:rgba(120,120,128,.12);color:#3A3A3C}
.schip.daycare{background:#ffe8d6;color:#C93400}

#schedDlg,#hospDlg,#medDlg,#packDlg,#growDlg{
  position:fixed;inset:0;z-index:110;display:none;align-items:flex-end;justify-content:center;
  background:rgba(29,29,31,.28);padding:12px
}
#schedDlg .gatebox,#hospDlg .gatebox,#medDlg .gatebox,#packDlg .gatebox,#growDlg .gatebox{
  max-width:420px;margin-bottom:var(--safe-b);max-height:min(90vh, 90dvh);overflow:auto
}
#schedDlg .daysel{display:flex;gap:4px}
#schedDlg .daysel button{flex:1;padding:8px 0;min-height:44px;font-size:13px}
#schedDlg .times,#medDlg .times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#schedDlg .kinds,#hospDlg .kinds,#medDlg .kinds,#packDlg .kinds,#growDlg .kinds,#medDlg .doses{display:flex;gap:6px;flex-wrap:wrap}
#schedDlg .kinds button,#hospDlg .kinds button,#medDlg .kinds button,#packDlg .kinds button,#growDlg .kinds button,#medDlg .doses button{flex:1;min-height:44px;min-width:64px}
.kinds button.on,.doses button.on,#gidSex button.on{background:#1D1D1F;color:#fff}

.gstat{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.gchip{flex:1;min-width:120px;padding:12px 14px;border-radius:16px}
.gchip b{display:block;font-size:20px;font-weight:700;letter-spacing:-0.02em}
.gchip span{font-size:12px;color:var(--dim)}
.gsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.gsum .gchip b.low{color:#FF3B30}
.gsum .gchip b.high{color:#FF9F0A}
.gchart{position:relative;width:100%;height:260px;margin-top:4px}
.gchart svg{width:100%;height:100%;display:block}
.gchart .tip{
  display:none;position:absolute;z-index:2;min-width:148px;padding:8px 10px;
  background:#fff;border-radius:12px;box-shadow:0 8px 24px var(--shadow);
  font-size:11px;line-height:1.45;color:var(--ink);pointer-events:none;
}
.gchart .tip.on{display:block}
.gleg{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;font-size:12px;color:var(--dim);font-weight:600}
.gleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.gleg i.in{background:#5B8DEF}
.gleg i.p3{background:#FF9F0A}
.gleg i.p50{background:#34C759}
.gleg i.p97{background:#FF3B30}
#gidBirth{
  width:100%;margin:4px 0 8px;font:inherit;font-size:16px;padding:12px;
  border:1px solid rgba(120,120,128,.22);border-radius:12px;background:rgba(255,255,255,.8);color:var(--ink)
}

.psheet{display:table;width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px}
.psheet thead{display:table-header-group}
.psheet tbody{display:table-row-group}
.psheet tr{display:table-row}
.psheet th,.psheet td{display:table-cell;border:1px solid rgba(60,60,67,.18);padding:2px 1px;text-align:center;vertical-align:middle}
.psheet th.g{background:#0A84FF;color:#fff;font-size:12px;font-weight:700}
.psheet th.day{background:#3A3A3C;color:#fff;width:36px;font-weight:700}
.psheet th.it{background:#f5f6fa;color:#1D1D1F;font-size:10px;line-height:1.1;padding:5px 2px;height:74px;
  writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap}
.psheet td.day{background:#f2f3f7;font-size:11px;font-weight:600;white-space:nowrap}
.psheet tr.pwk td{background:#fff6e0}
.psheet tr.pwk td.day{background:#FF9F0A;color:#1D1D1F}
.psheet td.off{background:#eceef3}
.psheet td.off .mcbox{visibility:hidden}
.mcbox{
  display:inline-block;width:14px;height:14px;border:1.5px solid rgba(60,60,67,.35);border-radius:4px;
  vertical-align:middle;background:#fff
}
#printPreview{display:none;position:fixed;inset:0;z-index:120;background:#eef1f6;overflow:auto;
  padding:calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(16px + var(--safe-b)) calc(10px + var(--safe-l))}
#printPreview .printbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
#printKids{display:flex;gap:4px;flex-wrap:wrap}
#printKids button{min-height:40px}
#printSheet{background:transparent;border:none;padding:0}
.mcpage{
  background:#fff;color:#1D1D1F;border:1px solid rgba(60,60,67,.12);border-radius:16px;
  box-shadow:0 8px 24px var(--shadow);padding:12px;margin:0 0 18px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact
}
.mchd{display:flex;align-items:center;gap:10px;padding:8px 4px 12px;margin-bottom:6px;color:#1D1D1F;background:transparent;border:0}
.mchd .ttl{font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-0.02em}
.mchd .sub{font-size:12px;color:var(--dim)}

function ageMonthsOn(birth, date){

  var m = (d.getFullYear()-b.getFullYear())*12 + (d.getMonth()-b.getMonth());
  if(d.getDate() < b.getDate()) m--;

}

function normCdf(z){
  var t = 1/(1+0.2316419*Math.abs(z));
  var d = 0.3989422804*Math.exp(-z*z/2);
  var p = d*t*(0.31938153+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0 ? 1-p : p;
}
function lmsAt(kind, sex, months){
  var table = (typeof GROWTH_LMS !== "undefined" && GROWTH_LMS[kind]) ? GROWTH_LMS[kind][sex==="M"?"M":"F"] : null;
  if(!table || !table.length) return null;
  if(months <= table[0][0]) return {L:table[0][1], M:table[0][2], S:table[0][3]};
  if(months >= table[table.length-1][0]) return {L:table[table.length-1][1], M:table[table.length-1][2], S:table[table.length-1][3]};
  var lo = 0, hi = table.length-1;
  while(hi-lo>1){
    var mid = (lo+hi)>>1;
    if(table[mid][0] <= months) lo = mid; else hi = mid;
  }
  var a = table[lo], b = table[hi], t = (months-a[0])/((b[0]-a[0])||1);
  return {L:a[1]+(b[1]-a[1])*t, M:a[2]+(b[2]-a[2])*t, S:a[3]+(b[3]-a[3])*t};
}
function lmsZ(y, lms){
  if(!lms || !y || y<=0) return null;
  if(Math.abs(lms.L) < 1e-6) return Math.log(y/lms.M)/lms.S;
  return (Math.pow(y/lms.M, lms.L)-1)/(lms.L*lms.S);
}
function pctOf(kind, sex, months, value){
  var z = lmsZ(value, lmsAt(kind, sex, months));
  if(z==null || !isFinite(z)) return null;
  return Math.max(0.1, Math.min(99.9, normCdf(z)*100));
}

function lmsY(z, lms){
  if(!lms || !lms.M || !lms.S) return null;
  if(Math.abs(lms.L) < 1e-6) return lms.M * Math.exp(lms.S * z);
  var inner = 1 + lms.L * lms.S * z;

  var ageNow = ageMonthsOn(pr.birth, TODAY_KEY) || 0;
  var last = items.length ? items[items.length-1] : null;
  var focus = last || {months:ageNow, value:null, date:TODAY_KEY};
  var p = (focus.value!=null) ? pctOf(growKind, sex, focus.months, focus.value) : null;
  var judge = growJudge(growKind, p);
  sum.innerHTML =
    '<div class="gchip"><span>신체계측치</span><b>'+(focus.value!=null?niceNum(focus.value, unit):"-")+'</b></div>'
    + '<div class="gchip"><span>백분위수</span><b>'+(p==null?"-":(Math.round(p*10)/10))+'</b></div>'
    + '<div class="gchip"><span>판정</span><b class="'+judge.cls+'">'+judge.label+'</b></div>';
  var x1 = Math.min(227, Math.max(24, Math.ceil((Math.max(ageNow, focus.months)+12)/12)*12));
  var x0 = 0;
  var step = x1>120 ? 2 : 1;
  function series(z){
    var pts = [];
    for(var m=x0;m<=x1;m+=step){
      var y = refValue(growKind, sex, m, z);
      if(y!=null) pts.push([m,y]);
    }
    return pts;
  }
  var p3 = series(Z_P3), p50 = series(Z_P50), p97 = series(Z_P97);
  var ys = p3.concat(p50).concat(p97).map(function(pt){ return pt[1]; });
  items.forEach(function(it){ ys.push(it.value); });
  var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
  var pad = (yMax-yMin)*0.12 || 4;
  yMin = Math.max(0, yMin-pad);
  yMax = yMax+pad;
  var W = 360, H = 240, L = 36, T = 10, R = 10, B = 28;
  var iw = W-L-R, ih = H-T-B;
  function sx(m){ return L + (m-x0)/((x1-x0)||1)*iw; }
  function sy(v){ return T + (yMax-v)/((yMax-yMin)||1)*ih; }
  function path(pts){
    return pts.map(function(pt,i){ return (i?"L":"M")+sx(pt[0]).toFixed(1)+","+sy(pt[1]).toFixed(1); }).join(" ");
  }
  function ticks(a,b,n){
    var out=[], span=b-a;
    if(span<=0) return [a,b];
    var raw=span/n, pow=Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
    var nice=pow; if(raw/pow>5) nice=5*pow; else if(raw/pow>2) nice=2*pow;
    var v=Math.ceil(a/nice)*nice;
    for(;v<=b+1e-9;v+=nice) out.push(Math.round(v*10)/10);
    return out;
  }
  var xt = ticks(x0, x1, 6), yt = ticks(yMin, yMax, 5);
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-label="성장 곡선">';
  yt.forEach(function(v){
    svg += '<line x1="'+L+'" y1="'+sy(v).toFixed(1)+'" x2="'+(W-R)+'" y2="'+sy(v).toFixed(1)+'" stroke="rgba(60,60,67,.12)" stroke-width="1"/>';
    svg += '<text x="'+(L-4)+'" y="'+(sy(v)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="#6E6E73">'+v+'</text>';
  });
  xt.forEach(function(v){
    svg += '<text x="'+sx(v).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8" fill="#6E6E73">'+v+'</text>';
  });
  svg += '<text x="'+(W/2)+'" y="'+(H-1)+'" text-anchor="middle" font-size="8" fill="#6E6E73">만 나이(개월)</text>';
  svg += '<path d="'+path(p3)+'" fill="none" stroke="#FF9F0A" stroke-width="1.6" stroke-dasharray="3 3"/>';
  svg += '<path d="'+path(p50)+'" fill="none" stroke="#34C759" stroke-width="1.6" stroke-dasharray="3 3"/>';
  svg += '<path d="'+path(p97)+'" fill="none" stroke="#FF3B30" stroke-width="1.6" stroke-dasharray="3 3"/>';
  if(items.length>1){
    svg += '<path d="'+path(items.map(function(it){ return [it.months, it.value]; }))+'" fill="none" stroke="#5B8DEF" stroke-width="1.8"/>';
  }
  items.forEach(function(it){
    svg += '<circle cx="'+sx(it.months).toFixed(1)+'" cy="'+sy(it.value).toFixed(1)+'" r="4" fill="#5B8DEF"/>';
  });
  svg += "</svg>";
  box.innerHTML = svg + '<div class="tip" id="growTip"></div>';
  var tip = document.getElementById("growTip");
  function showTip(m, clientX, clientY){
    m = Math.max(x0, Math.min(x1, Math.round(m)));
    var v3 = refValue(growKind, sex, m, Z_P3);
    var v50 = refValue(growKind, sex, m, Z_P50);
    var v97 = refValue(growKind, sex, m, Z_P97);
    var nearest = null, best=99;
    items.forEach(function(it){
      var d = Math.abs(it.months-m);
      if(d<best){ best=d; nearest=it; }
    });
    var html = '<b>'+m+'개월</b><br>P3(하단선): '+niceNum(v3, unit)
      +'<br>P50(중앙선): '+niceNum(v50, unit)
      +'<br>P97(상단선): '+niceNum(v97, unit);
    if(nearest && best<=2) html += '<br>입력: '+niceNum(nearest.value, unit);
    tip.innerHTML = html;
    tip.className = "tip on";
    var r = box.getBoundingClientRect();
    tip.style.left = Math.min(r.width-160, Math.max(8, clientX-r.left+8))+"px";
    tip.style.top = Math.max(8, clientY-r.top-70)+"px";
  }
  box.onpointerdown = box.onpointermove = function(e){
    var svgEl = box.querySelector("svg");
    if(!svgEl) return;
    var r = svgEl.getBoundingClientRect();
    var x = (e.clientX-r.left)/r.width*W;
    var m = x0 + (x-L)/iw*(x1-x0);
    if(!isFinite(m)) return;
    showTip(m, e.clientX, e.clientY);
  };
  box.onpointerleave = function(){ tip.className = "tip"; };
}

function keySet(){
  var s = {};
  for(var i=0;i<arguments.length;i++){
    var o = arguments[i];
    if(!o || typeof o !== "object") continue;
    Object.keys(o).forEach(function(k){ s[k] = true; });
  }
  return Object.keys(s);
}
function mergeMeta(base, local, remote){
  var b = (base && base.used) || 0, l = (local && local.used) || 0, r = (remote && remote.used) || 0;
  return {used: l !== b ? l : r};
}
function mergeDay(base, local, remote){
  base = base || {}; local = local || {}; remote = remote || {};
  var bt = base.t || {}, lt = local.t || {}, rt = remote.t || {};
  var bh = base.h || {}, lh = local.h || {}, rh = remote.h || {};
  var t = {}, h = {};
  keySet(bt, lt, rt).forEach(function(id){
    var lv = !!lt[id], bv = !!bt[id], rv = !!rt[id];
    t[id] = lv !== bv ? lv : rv;
  });
  keySet(bh, lh, rh).forEach(function(id){
    var lv = lh[id] || "", bv = bh[id] || "", rv = rh[id] || "";
    h[id] = lv !== bv ? lv : rv;
  });
  return {t:t, h:h};
}
function mergeKid(base, local, remote){
  base = base || {}; local = local || {}; remote = remote || {};
  var out = {};
  keySet(base, local, remote).forEach(function(k){
    if(k === "_meta") out._meta = mergeMeta(base._meta, local._meta, remote._meta);
    else out[k] = mergeDay(base[k], local[k], remote[k]);
  });
  return out;
}
function mergeThree(base, local, remote){
  base = base || {}; local = local || {}; remote = remote || {};
  var out = {};
  keySet(base, local, remote).forEach(function(kid){
    if(kid === "_game"){
      out._game = window.GameTime ? GameTime.mergeGameLock(base._game, local._game, remote._game) : (local._game || remote._game || {});
      return;
    }
    out[kid] = mergeKid(base[kid], local[kid], remote[kid]);
  });
  return out;
}

  if(!allowed){ setSync("이 기기에만 저장됨"); return; }

      .then(function(got){
        var remote = (!got.error && got.data && got.data.data) ? got.data.data : null;
        var merged = (!replace && remote != null) ? mergeThree(baseSnap, snapshot, remote) : snapshot;
        return sb.from("mission_weeks").upsert({
          week_start: savedWeek, data: merged,
          updated_at: new Date().toISOString(), updated_by: myEmail

          setSync(got.error ? "저장됨 · 상대 최신값 합치기 실패" : "저장됨 ✔");
          clearPendingSoon();
        });
      })
      .catch(function(e){
        pending = false;

      });
  }, 600);
}

  groups.forEach(function(g){ head += "<th class='g' colspan='"+g.n+"'>"+g.name+"</th>"; });

    head += "<th class='it' title='"+(c.tag?c.label+" · "+c.tag:c.label)+"'>"+c.label+(c.tag?" · "+c.tag:"")+"</th>";

    + "<table class='psheet'><thead>"+head+"</thead><tbody>"+body+"</tbody></table>"
    + "<div class='mcfoot'><b>✓</b> 완료 · 주말은 노란 칸 · 회색은 쉬는 날 · A4 가로 1장</div>"

function weekStats(kid){
  var bad = 0, doneDays = 0, checkedDays = 0, reqDone = 0, reqTotal = 0;
  for(var i=0;i<7;i++){
    var d = addDays(weekStart,i), c = cell(kid.id, fmt(d));
    HABITS.forEach(function(h){ if(c.h[h.id]==="no") bad++; });
    var st = dayStatus(kid,d);
    if(st.n>0) checkedDays++;
    if(st.total && st.n>=st.total) doneDays++;
    reqDone += st.n; reqTotal += st.total;
  }
  var deduct = bad*PENALTY;
  var remain = Math.max(0, BASE_MIN - deduct);
  if(window.GameTime){
    var gt = GameTime.compute(kid, data, weekStart, gameRules, new Date());
    if(gt.status === "unregistered"){ remain = null; deduct = 0; }
    else { remain = gt.minutes; deduct = Math.max(0, (gameRules.base_minutes||BASE_MIN) - remain); }
  }
  var weekly = weeklyItems(kid).map(function(it){
    var n=0; for(var i=0;i<7;i++){ if(cell(kid.id,fmt(addDays(weekStart,i))).t[it.id]) n++; }
    return {label:it.label, n:n, target:it.weekly, ok:n>=it.weekly};
  });
  var wkOk = weekly.every(function(it){ return it.ok; });
  var used = (meta(kid.id).used) || 0;
  var left = remain == null ? 0 : Math.max(0, remain - used);
  var playOk = doneDays>=checkedDays && checkedDays>0 && wkOk;
  return {
    bad:bad, deduct:deduct, remain:remain, used:used, left:left,
    doneDays:doneDays, checkedDays:checkedDays, reqDone:reqDone, reqTotal:reqTotal,
    pct: reqTotal ? Math.round(reqDone/reqTotal*100) : 0,
    weekly:weekly, wkOk:wkOk, playOk:playOk
  };
}

function pull(){
  if(!sb || !allowed){ weekLoaded = true; return; }
  setSync("불러오는 중…");
  weekLoaded = false;
  sb.from("mission_weeks").select("data").eq("week_start", weekKey()).maybeSingle()
    .then(function(r){
      if(r.error){ weekLoaded = true; setSync("불러오기 실패: " + r.error.message); return; }
      if(r.data && r.data.data){
        data = r.data.data;
        cacheLocal();
      }
      setBase();
      weekLoaded = true;
      render();
      setSync("동기화됨 ✔");
    })
    .catch(function(e){
      weekLoaded = true;
      setSync("불러오기 실패: " + ((e && e.message) || "연결할 수 없습니다"));
    });
}
function subscribe(){
  if(chan){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
  chan = sb.channel("mission-sync")
    .on("postgres_changes", {event:"*", schema:"public", table:"mission_weeks"}, function(p){
      var row = p["new"];
      if(!row) return;
      if(row.week_start === SCHEDULE_WEEK){
        if(schedPending) return;
        schedule = row.data || defaultSchedule();
        ensureSchedule();
        cacheSchedule();
        render();
        setSync("상대방 변경 반영됨 ✔");
        return;
      }
      if(row.week_start === HOSPITAL_WEEK){
        if(hospPending) return;
        var hd = row.data;
        hospitals = Array.isArray(hd) ? hd : ((hd && hd.items) || []);
        cacheHospital();
        render();
        setSync("상대방 변경 반영됨 ✔");
        return;
      }
      if(row.week_start === MEDICINE_WEEK){
        if(medPending) return;
        var md = row.data;
        medicines = Array.isArray(md) ? md : ((md && md.items) || []);
        cacheMedicine();
        render();
        setSync("상대방 변경 반영됨 ✔");
        return;
      }
      if(row.week_start === PACKING_WEEK){
        if(packPending) return;
        var pd = row.data;
        packs = Array.isArray(pd) ? pd : ((pd && pd.items) || []);
        cachePacking();
        render();
        setSync("상대방 변경 반영됨 ✔");
        return;
      }
      if(row.week_start === RULE_WEEK){
        if(row.data && window.GameTime){
          gameRules = GameTime.normalizeRules(row.data);
          try{ localStorage.setItem("mission:rules", JSON.stringify(gameRules)); }catch(e){}
          render();
        }
        setSync("상대방 변경 반영됨 ✔");
        return;
      }
      if(row.week_start === GROWTH_WEEK){
        if(growPending) return;
        if(row.data && typeof row.data === "object"){
          growth = row.data;
          ensureGrowth();
          cacheGrowth();
          render();
        }
        setSync("상대방 변경 반영됨 ✔");
        return;
      }
      if(row.week_start !== weekKey()) return;
      if(pending) return;
      data = row.data || {};
      setBase();
      cacheLocal(); render();
      setSync("상대방 변경 반영됨 ✔");
    })
    .subscribe();
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && allowed){ pull(); pullSchedule(); pullHospital(); pullMedicine(); pullPacking(); pullGrowth(); pullRules(); }
});


/* ============ 로그인 (Supabase Auth) ============ */
function gmsg(t, ok){
  var p = document.getElementById("gerr");
  p.style.color = ok ? "#059669" : "#FF3B30";
  p.textContent = t || "";
}
function showGate(){
  document.getElementById("gate").style.display = "flex";
  document.body.style.overflow = "hidden";
}
function hideGate(){
  document.getElementById("gate").style.display = "none";
  document.body.style.overflow = "";
}
function krErr(m){
  m = m || "";
  if(/Invalid login/i.test(m)) return "이메일 또는 비밀번호가 올바르지 않습니다";
  if(/already registered|User already/i.test(m)) return "이미 가입된 이메일입니다. 로그인하세요";
  if(/at least 6|Password should be/i.test(m)) return "비밀번호는 6자 이상이어야 합니다";
  if(/Email not confirmed/i.test(m)) return "메일 인증이 아직 안 됐습니다. 받은 메일의 링크를 눌러주세요";
  if(/valid email|Unable to validate/i.test(m)) return "이메일 형식을 확인해 주세요";
  return m;
}
function creds(){
  return {
    email: document.getElementById("gid").value.trim(),
    password: document.getElementById("gpw").value
  };
}
function doLogin(){
  if(!sb){ gmsg("설정이 필요합니다"); return; }
  var c = creds();
  if(!c.email || !c.password){ gmsg("이메일과 비밀번호를 입력하세요"); return; }
  gmsg("로그인 중…", true);
  sb.auth.signInWithPassword(c).then(function(r){
    if(r.error) gmsg(krErr(r.error.message));
    else document.getElementById("gpw").value = "";
  }).catch(function(e){
    gmsg(krErr((e && e.message) || "연결할 수 없습니다"));
  });
}
function doSignup(){
  if(!sb){ gmsg("설정이 필요합니다"); return; }
  var c = creds();
  if(!c.email || !c.password){ gmsg("이메일과 비밀번호를 입력하세요"); return; }
  gmsg("가입 중…", true);
  sb.auth.signUp(c).then(function(r){
    if(r.error){ gmsg(krErr(r.error.message)); return; }
    if(r.data && r.data.session) gmsg("가입 완료!", true);
    else gmsg("확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인하세요.", true);
  }).catch(function(e){
    gmsg(krErr((e && e.message) || "연결할 수 없습니다"));
  });
}
function enterApp(){
  gmsg("");
  hideGate();
  document.getElementById("who").textContent = myEmail;
  loadLocal(); render();
  pull();
  pullSchedule();
  pullHospital();
  pullMedicine();
  pullPacking();
  pullGrowth();
  pullRules();
  subscribe();
}
function pullRules(){
  if(!sb || !allowed || !window.GameTime) return;
  sb.from("mission_weeks").select("data").eq("week_start", RULE_WEEK).maybeSingle()
    .then(function(r){
      if(r.error || !r.data || !r.data.data) return;
      gameRules = GameTime.normalizeRules(r.data.data);
      try{ localStorage.setItem("mission:rules", JSON.stringify(gameRules)); }catch(e){}
      render();
    });
}
function enterOffline(msg){
  myEmail = lastAllowed();
  allowed = !!myEmail;
  hideGate();
  document.getElementById("who").textContent = myEmail;
  weekLoaded = true;
  loadLocal(); render();
  setSync(msg || "저장 실패: 연결할 수 없습니다");
}
function onSession(sess){
  var gen = ++sessionGen;
  if(!sess){
    myEmail = ""; allowed = false;
    if(chan && sb){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
    document.getElementById("who").textContent = "";
    setSync("로그인이 필요합니다");
    showGate();
    return;
  }
  myEmail = sess.user.email;
  sb.from("allowed_users").select("email").eq("email", myEmail).maybeSingle().then(function(r){
    if(gen !== sessionGen) return;
    if(r.error){
      if(lastAllowed() === myEmail){
        allowed = true;
        enterApp();
        setSync("불러오기 실패: " + r.error.message);
        return;
      }
      showGate();
      gmsg("허용 여부를 확인할 수 없습니다.\n" + r.error.message);
      setSync("저장 실패: " + r.error.message);
      return;
    }
    if(!r.data){
      allowed = false;
      rememberAllowed("");
      showGate();
      gmsg("이 계정은 아직 승인되지 않았습니다");
      setSync("승인되지 않은 계정");
      return;
    }
    allowed = true;
    rememberAllowed(myEmail);
    enterApp();
  }).catch(function(e){
    if(gen !== sessionGen) return;
    if(lastAllowed() === myEmail){
      allowed = true;
      enterApp();
    } else {
      showGate();
    }
    setSync("저장 실패: " + ((e && e.message) || "연결할 수 없습니다"));
  });
}
document.getElementById("gbtn").onclick = doLogin;
document.getElementById("gsignup").onclick = doSignup;
["gid","gpw"].forEach(function(k){
  document.getElementById(k).addEventListener("keydown", function(e){
    if(e.key === "Enter") doLogin();
  });
});
document.getElementById("logoutBtn").onclick = function(){
  rememberAllowed("");
  if(sb) sb.auth.signOut();
  else {
    myEmail = ""; allowed = false;
    document.getElementById("who").textContent = "";
    showGate();
    setSync("로그인이 필요합니다");
  }
};

/* ============ 시작 ============ */
loadLocal();
render();
showGate();

if(!isConfigured()){
  gmsg("설정이 필요합니다.\n파일 위쪽의 SUPABASE_URL 과 SUPABASE_ANON_KEY 를 채워주세요.");
  setSync("설정 필요");
} else if(!window.supabase){
  gmsg("Supabase 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인하고 새로고침하세요.");
  enterOffline("저장 실패: 연결할 수 없습니다");
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  setSync("확인 중…");
  sb.auth.onAuthStateChange(function(_e, sess){ onSession(sess); });
}
})();
</script>
