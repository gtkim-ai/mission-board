<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미션보드">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#63a03f">
<title>하주 · 하유 미션 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7dfcb; --panel:#f6f0e1; --panel2:#ece3cf; --ink:#2b241a; --dim:#7a6c56;
  --line:#1d1a15; --grass:#63a03f; --grass-lt:#82c356; --dirt:#8a5f3c; --dirt-dk:#63422a;
  --stone:#8d8d8d; --gold:#e6a92b; --dia:#3fbfbf; --red:#cf3b2f;
  --shadow:rgba(0,0,0,.28); --hi:rgba(255,255,255,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140f; --panel:#2a251d; --panel2:#221d16; --ink:#f0e7d5; --dim:#a4967d;
    --line:#0d0b08; --grass:#4e8434; --grass-lt:#6aa544; --dirt:#6b4a2e; --dirt-dk:#4a3220;
    --stone:#6d6d6d; --gold:#d59a23; --dia:#37a8a8; --red:#c23a2f;
    --shadow:rgba(0,0,0,.45); --hi:rgba(255,255,255,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#17140f; --panel:#2a251d; --panel2:#221d16; --ink:#f0e7d5; --dim:#a4967d;
  --line:#0d0b08; --grass:#4e8434; --grass-lt:#6aa544; --dirt:#6b4a2e; --dirt-dk:#4a3220;
  --stone:#6d6d6d; --gold:#d59a23; --dia:#37a8a8; --red:#c23a2f;
  --shadow:rgba(0,0,0,.45); --hi:rgba(255,255,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Gothic A1',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:700; line-height:1.45; max-width:920px; margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button,.task,.sub,.habit .st{touch-action:manipulation; -webkit-user-select:none; user-select:none}
h1,h2,h3,.px-font{font-family:'Do Hyeon','Gothic A1',sans-serif;font-weight:400;letter-spacing:.5px}
img,svg{max-width:100%; image-rendering:pixelated}

/* ---- blocky chrome ---- */
.blk{border:3px solid var(--line); box-shadow:inset -4px -4px 0 var(--shadow), inset 4px 4px 0 var(--hi);}
.card{background:var(--panel); border:3px solid var(--line); box-shadow:4px 4px 0 var(--shadow); margin-bottom:14px}
.card > .head{
  background:var(--dirt); color:#fff8e7; padding:8px 12px; border-bottom:3px solid var(--line);
  font-family:'Do Hyeon',sans-serif; font-size:17px; display:flex; align-items:center; gap:8px;
  box-shadow:inset 0 -4px 0 var(--dirt-dk), inset 0 4px 0 rgba(255,255,255,.18);
}
.card > .body{padding:12px}

/* ---- header ---- */
header{position:relative; margin-bottom:14px; border:3px solid var(--line); box-shadow:4px 4px 0 var(--shadow);
  background:
   repeating-linear-gradient(90deg, var(--dirt) 0 14px, var(--dirt-dk) 14px 28px) 0 0/auto 100%;
  overflow:hidden}
header .turf{height:16px;background:repeating-linear-gradient(90deg,var(--grass) 0 14px,var(--grass-lt) 14px 28px);border-bottom:3px solid var(--line)}
header .inner{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff6e4}
header h1{margin:0;font-size:23px;text-shadow:3px 3px 0 rgba(0,0,0,.45)}
header p{margin:2px 0 0;font-size:12.5px;color:#f0dcbb;font-weight:700;text-shadow:2px 2px 0 rgba(0,0,0,.35)}

/* ---- buttons ---- */
button{font-family:inherit;font-weight:700;color:var(--ink);cursor:pointer;
  background:var(--panel2); border:3px solid var(--line); padding:7px 11px; font-size:14px;
  box-shadow:inset -4px -4px 0 var(--shadow), inset 4px 4px 0 var(--hi);}
button:active{box-shadow:inset 4px 4px 0 var(--shadow)}
button.on{background:var(--grass); color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font-family:'Do Hyeon',sans-serif;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px}
.tabs button.on{background:var(--grass);color:#fff}
.tabs svg{width:26px;height:26px;flex:none}

.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav .label{flex:1;text-align:center;font-family:'Do Hyeon',sans-serif;font-size:16px;
  background:var(--panel);border:3px solid var(--line);padding:7px;box-shadow:4px 4px 0 var(--shadow)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px;
  position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 8px}
.days button{padding:8px 1px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1;min-height:60px;justify-content:center}
.days button .d{font-family:'Do Hyeon',sans-serif;font-size:16px}
.days button.sel{background:var(--gold);color:#2b241a}
.days button.today{outline:3px solid var(--dia);outline-offset:-9px}
.days .dot{width:8px;height:8px;background:var(--stone);border:2px solid var(--line)}
.days .dot.done{background:var(--grass-lt)}
.days .dot.part{background:var(--gold)}

/* ---- task rows ---- */
.grp{margin-bottom:10px}
.grp h3{margin:0 0 6px;font-size:15px;color:var(--dim);display:flex;align-items:center;gap:6px}
.grp h3::before{content:"";width:12px;height:12px;background:var(--dirt);border:2px solid var(--line)}
.task{display:flex;align-items:center;gap:10px;padding:10px 10px;background:var(--panel2);
  border:3px solid var(--line);margin-bottom:7px;cursor:pointer;user-select:none;min-height:52px}
.task.done{background:color-mix(in srgb,var(--grass) 30%, var(--panel2))}
.task .box{width:28px;height:28px;flex:none;background:var(--panel);border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;
  box-shadow:inset -3px -3px 0 var(--shadow)}
.task.done .box{background:var(--grass)}
.task .txt{flex:1;font-size:15px}
.task .tag{font-size:11px;background:var(--gold);color:#2b241a;border:2px solid var(--line);padding:2px 5px;white-space:nowrap}
.subs{display:flex;flex-wrap:wrap;gap:7px;margin:-2px 0 9px 12px}
.subs .sub{display:flex;align-items:center;gap:6px;padding:9px 10px;background:var(--panel2);
  border:3px solid var(--line);font-size:13.5px;cursor:pointer;min-height:44px}
.subs .sub.done{background:color-mix(in srgb,var(--grass) 32%, var(--panel2))}
.subs .sub .box{width:16px;height:16px;border-width:2px;font-size:11px}

/* ---- habits ---- */
.habit{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);
  border:3px solid var(--line);margin-bottom:7px;min-height:56px}
.habit .txt{flex:1;font-size:14.5px}
.habit .st{width:56px;height:44px;flex:none;font-family:'Do Hyeon',sans-serif;font-size:20px;padding:0}
.habit .st[data-v="ok"]{background:var(--grass);color:#fff}
.habit .st[data-v="no"]{background:var(--red);color:#fff}
.note{font-size:12.5px;color:var(--dim);margin:8px 0 0}

/* ---- reward ---- */
.bank{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blocks{display:flex;gap:5px}
.blocks i{width:34px;height:34px;display:block;border:3px solid var(--line);
  background:repeating-linear-gradient(135deg,var(--dia) 0 6px,color-mix(in srgb,var(--dia) 70%,#fff) 6px 12px);
  box-shadow:inset -4px -4px 0 var(--shadow), inset 4px 4px 0 var(--hi)}
.blocks i.gone{background:var(--stone);opacity:.5}
.big{font-family:'Do Hyeon',sans-serif;font-size:30px;line-height:1}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;margin-top:10px}
.stat b{font-weight:900}
.bar{height:16px;background:var(--panel2);border:3px solid var(--line);margin-top:8px;position:relative;overflow:hidden}
.bar > span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--grass) 0 8px,var(--grass-lt) 8px 16px)}
.ok-badge{font-family:'Do Hyeon',sans-serif;font-size:16px;padding:6px 10px;border:3px solid var(--line);
  background:var(--gold);color:#2b241a;box-shadow:4px 4px 0 var(--shadow)}
.ok-badge.no{background:var(--stone);color:#fff}
.wk{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;
  padding:6px 9px;background:var(--panel2);border:3px solid var(--line);margin-bottom:6px}
.wk .cnt{font-family:'Do Hyeon',sans-serif;font-size:16px}
.wk .cnt.ok{color:var(--grass)}
button.rpthead{
  width:100%;display:flex;align-items:center;gap:8px;text-align:left;
  background:var(--dirt);color:#fff8e7;padding:8px 12px;font-size:16px;
  font-family:'Do Hyeon',sans-serif;min-height:48px;
  box-shadow:inset 0 -4px 0 var(--dirt-dk), inset 0 4px 0 rgba(255,255,255,.18);
}
button.rpthead:active{box-shadow:inset 4px 4px 0 var(--shadow)}
.rptsum{flex:1;display:flex;flex-wrap:wrap;gap:6px;font-family:'Gothic A1',sans-serif;font-size:12px;font-weight:700}
.rptchip{background:rgba(0,0,0,.22);border:2px solid var(--line);padding:3px 7px;color:#fff8e7;white-space:nowrap}
.rptchip.ok{background:var(--grass)}
.rptchev{flex:none;font-size:14px;opacity:.85}
.rptlist{display:flex;flex-direction:column;gap:6px}
.rptrow{display:flex;align-items:center;gap:8px;padding:8px;background:var(--panel2);
  border:3px solid var(--line);min-height:44px;font-size:13px}
.rptrow .nm{flex:1;min-width:0}
.rptrow .ok-badge{font-size:13px;padding:4px 7px;box-shadow:none;white-space:nowrap}
footer{font-size:12px;color:var(--dim);text-align:center;margin:18px 0 6px}
#sync{font-size:11.5px;color:var(--dim)}
#gate{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:var(--bg);padding:20px}
.gatebox{width:100%;max-width:330px;background:var(--panel);border:3px solid var(--line);
  box-shadow:6px 6px 0 var(--shadow);padding:18px}
.gatebox .gtitle{font-family:'Do Hyeon',sans-serif;font-size:22px;text-align:center;margin-bottom:6px}
.gatebox .gsub{font-size:12.5px;color:var(--dim);text-align:center;margin-bottom:14px}
.gatebox label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
.gatebox input{width:100%;font-family:inherit;font-weight:700;font-size:16px;padding:11px;
  background:var(--panel2);color:var(--ink);border:3px solid var(--line);
  box-shadow:inset 3px 3px 0 var(--shadow)}
.gatebox button{width:100%;margin-top:16px;padding:13px;font-size:16px;background:var(--grass);color:#fff}
.gatebox button.sub{background:var(--panel2);color:var(--ink);margin-top:8px}
.gatebox p{min-height:18px;margin:10px 0 0;font-size:13px;color:var(--red);text-align:center;line-height:1.4;white-space:pre-line}
#who{font-size:11.5px;color:var(--dim);margin-right:8px}
.wkend{background:var(--gold);color:#2b241a;border:3px solid var(--line);padding:10px;
  margin-bottom:10px;font-size:14px;line-height:1.4}
.days button.wk .d{color:var(--gold)}
.days button.sel .d{color:#2b241a}
.usebtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.usebtns button{flex:1;min-height:44px}
.weeknav button{min-height:44px;min-width:48px;font-size:15px}
@media (max-width:430px){
  header h1{font-size:19px}
  header p{font-size:11.5px}
  header .inner{padding:10px}
  .tabs button{font-size:16px;min-height:52px}
  .weeknav .label{font-size:14px;padding:9px 2px}
  .card > .head{font-size:16px}
  .card > .body{padding:10px}
  .blocks i{width:30px;height:30px}
  .big{font-size:26px}
}
@media print{
  body{background:#fff;color:#000;padding:0}
  button,.weeknav,#printBtn,#backupBtn,#restoreBtn,footer,#sync{display:none!important}
  button.rpthead{display:flex!important}
  #report{display:block!important}
  .card{box-shadow:none;break-inside:avoid}
}
</style>

<body>

<div id="gate">

</div>

<header>
  <div class="turf"></div>
  <div class="inner">
    <div id="hdrAvatar"></div>
    <div>
      <h1>하주 · 하유 미션 보드</h1>
      <p>미션 클리어 → 토요일·주일에 게임 2시간 획득!</p>

<div class="tabs" id="tabs"></div>

<div class="weeknav">
  <button id="prevW">◀</button>

</div>

<div class="days" id="days"></div>

<div class="card" id="reportCard">

    <span>📊 주간 리포트</span>

<div class="card">

</div>

<div class="card">
  <div class="head">🧹 생활 미션 <span style="font-size:12px;opacity:.85">(어기면 30분 차감)</span></div>
  <div class="body" id="habits"></div>
</div>

<div class="card">
  <div class="head">📅 이번 주 미션</div>
  <div class="body" id="weekly"></div>
</div>

<div class="card">
  <div class="head">💎 게임 시간 통장</div>
  <div class="body" id="bank"></div>
</div>

<div class="row" style="margin-bottom:10px">
  <button id="printBtn">🖨 인쇄하기</button>
  <button id="backupBtn">📦 백업</button>
  <button id="restoreBtn">📥 복원</button>
  <button id="logoutBtn">🔒 잠그기</button>

  <span id="who"></span>
  <span id="sync">연결 중…</span>
</div>

<footer>토요일 또는 주일에 사용 · 주일이 지나면 남은 시간은 사라집니다</footer>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════════
   설정 — 아래 두 줄을 본인 Supabase 프로젝트 값으로 바꾸세요.
   Supabase 대시보드 → Project Settings → API 에서 확인합니다.
   ═══════════════════════════════════════════════════════════ */
var SUPABASE_URL      = "https://okrzyhcggpjczfjltndf.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rcnp5aGNnZ3BqY3pmamx0bmRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzY2MjAsImV4cCI6MjEwNTIxMjYyMH0.Voee4SJyexgIx7DcZecu2epkZQLytIiN1yrHSQ0GNxo";
var ALLOW_CACHE_KEY   = "mission:allowedEmail";
/* ═══════════════════════════════════════════════════════════ */

function isConfigured(){
  if(!SUPABASE_URL || SUPABASE_URL.indexOf("https://") !== 0) return false;
  if(SUPABASE_URL.indexOf("여기에") >= 0) return false;
  if(!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf("여기에") >= 0) return false;
  return true;
}

/* ============ 데이터 정의 ============ */
var ENGLISH = [
  {id:"en_focus", label:"집중듣기"},
  {id:"en_word",  label:"단어쓰기"},
  {id:"en_read",  label:"낭독영상", subs:[
      {id:"en_r1", label:"듣기"},
      {id:"en_r2", label:"듣고 따라읽기"},
      {id:"en_r3", label:"혼자 읽기"},
      {id:"en_r4", label:"검사"}]},
  {id:"en_work",  label:"문제집 풀기"},
  {id:"en_quiz",  label:"북퀴즈", weekly:2, tag:"3일에 1번"}
];
var MATH = [
  {id:"ma_calc",  label:"연산 1장"},
  {id:"ma_class", label:"학교 진도 문제풀이"}
];
var HOMERUN = [
  {id:"hr_day",  label:"그날의 학습하기"},
  {id:"hr_week", label:"오답노트 / 못한 것 하기", weekendOnly:true, tag:"주말"}
];
function groups(extra, engExtra){
  var g = [{name:"큐티", items:[{id:"qt", label:"큐티"}]}];
  if(extra) g.push(extra);
  g.push({name:"영어", items: engExtra ? ENGLISH.concat(engExtra) : ENGLISH});
  g.push({name:"수학", items:MATH});
  g.push({name:"홈런 · 아이스크림", items:HOMERUN});
  return g;
}
var KIDS = [
  {id:"hajoo", name:"김하주", skin:{hair:"#5b3a1e", shirt:"#4e8f3a"},
   groups: groups(null, [{id:"en_class", label:"클래스카드", weekly:3, tag:"주 3번"}])},
  {id:"hayoo", name:"김하유", skin:{hair:"#2b2b33", shirt:"#7a4fa8"},
   groups: groups({name:"학교 숙제", items:[
      {id:"sc_diary", label:"일기", weekly:2, tag:"주 2번"},
      {id:"sc_read",  label:"독서 30분 이상"},
      {id:"sc_log",   label:"독서기록장", weekly:1, tag:"주 1번"}
   ]})}
];
var HABITS = [
  {id:"hb_room",  label:"방 정리"},
  {id:"hb_cloth", label:"옷 정리"},
  {id:"hb_change",label:"학교·태권도 다녀와서 옷 갈아입기"},
  {id:"hb_living",label:"내 물건 거실에 두지 않기"}
];
var BASE_MIN = 120, PENALTY = 30;
var DAYN = ["월","화","수","목","금","토","일"];

/* 하루 필수 항목 (주간목표 항목은 제외, 부모 항목은 하위로 대체) */
function requiredIds(kid, date){
  var out = [], wknd = isWeekend(date);
  kid.groups.forEach(function(g){
    g.items.forEach(function(it){
      if(it.weekly) return;
      if(it.weekendOnly && !wknd) return;
      if(it.subs) it.subs.forEach(function(s){ out.push(s.id); });
      else out.push(it.id);
    });
  });
  return out;
}
function weeklyItems(kid){
  var out=[];
  kid.groups.forEach(function(g){ g.items.forEach(function(it){ if(it.weekly) out.push(it); }); });
  return out;
}

/* ============ 날짜 ============ */
function fmt(d){
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function monday(d){
  var c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  c.setDate(c.getDate() - ((c.getDay()+6)%7));
  return c;
}
function addDays(d,n){ var c=new Date(d.getFullYear(),d.getMonth(),d.getDate()); c.setDate(c.getDate()+n); return c; }
function isWeekend(d){ var w=d.getDay(); return w===0||w===6; }
var TODAY = new Date();
var TODAY_KEY = fmt(TODAY);

/* ============ 상태 ============ */
var weekStart = monday(TODAY);
var curKid = 0;
var curDate = new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
var data = {};              // { kidId: { dateKey: {t:{}, h:{}} } }
var sb = null, chan = null, saveTimer = null, pending = false, pendingClear = null;
var myEmail = "", allowed = false, sessionGen = 0;
var baseData = {};
var rptOpen = false;

function weekKey(){ return fmt(weekStart); }
function lsKey(){ return "mission:"+weekKey(); }
function cell(kidId, dateKey){
  data[kidId] = data[kidId] || {};
  data[kidId][dateKey] = data[kidId][dateKey] || {t:{}, h:{}};
  var c = data[kidId][dateKey];
  c.t = c.t || {}; c.h = c.h || {};
  return c;
}
function meta(kidId){
  data[kidId] = data[kidId] || {};
  data[kidId]._meta = data[kidId]._meta || {used:0};
  return data[kidId]._meta;
}
function cacheLocal(){
  try{ localStorage.setItem(lsKey(), JSON.stringify(data)); }catch(e){}
}
function loadLocal(){
  try{ var raw = localStorage.getItem(lsKey()); data = raw ? JSON.parse(raw) : {}; }
  catch(e){ data = {}; }
  if(!data || typeof data !== "object") data = {};
  setBase();
}
function clone(o){
  try{ return JSON.parse(JSON.stringify(o || {})); }
  catch(e){ return {}; }
}
function setBase(){ baseData = clone(data); }
function keySet(){
  var s = {};
  for(var i=0;i<arguments.length;i++){
    var o = arguments[i];
    if(!o || typeof o !== "object") continue;
    Object.keys(o).forEach(function(k){ s[k] = true; });
  }
  return Object.keys(s);
}
function mergeMeta(base, local, remote){
  var b = (base && base.used) || 0, l = (local && local.used) || 0, r = (remote && remote.used) || 0;
  return {used: l !== b ? l : r};
}
function mergeDay(base, local, remote){
  base = base || {}; local = local || {}; remote = remote || {};
  var bt = base.t || {}, lt = local.t || {}, rt = remote.t || {};
  var bh = base.h || {}, lh = local.h || {}, rh = remote.h || {};
  var t = {}, h = {};
  keySet(bt, lt, rt).forEach(function(id){
    var lv = !!lt[id], bv = !!bt[id], rv = !!rt[id];
    t[id] = lv !== bv ? lv : rv;
  });
  keySet(bh, lh, rh).forEach(function(id){
    var lv = lh[id] || "", bv = bh[id] || "", rv = rh[id] || "";
    h[id] = lv !== bv ? lv : rv;
  });
  return {t:t, h:h};
}
function mergeKid(base, local, remote){
  base = base || {}; local = local || {}; remote = remote || {};
  var out = {};
  keySet(base, local, remote).forEach(function(k){
    if(k === "_meta") out._meta = mergeMeta(base._meta, local._meta, remote._meta);
    else out[k] = mergeDay(base[k], local[k], remote[k]);
  });
  return out;
}
function mergeThree(base, local, remote){
  base = base || {}; local = local || {}; remote = remote || {};
  var out = {};
  keySet(base, local, remote).forEach(function(kid){
    out[kid] = mergeKid(base[kid], local[kid], remote[kid]);
  });
  return out;
}
function rememberAllowed(email){
  try{ if(email) localStorage.setItem(ALLOW_CACHE_KEY, email); else localStorage.removeItem(ALLOW_CACHE_KEY); }
  catch(e){}
}
function lastAllowed(){
  try{ return localStorage.getItem(ALLOW_CACHE_KEY) || ""; }catch(e){ return ""; }
}
function markPending(){
  pending = true;
  if(pendingClear){ clearTimeout(pendingClear); pendingClear = null; }
}
function clearPendingSoon(){
  if(pendingClear) clearTimeout(pendingClear);
  pendingClear = setTimeout(function(){ pending = false; pendingClear = null; }, 800);
}
function save(opts){
  opts = opts || {};
  cacheLocal();
  if(!sb){ setSync("저장 실패: 연결할 수 없습니다"); return; }
  if(!allowed){ setSync("이 기기에만 저장됨"); return; }
  markPending();
  clearTimeout(saveTimer);
  setSync("저장 중…");
  var savedWeek = weekKey();
  var snapshot = clone(data);
  var baseSnap = clone(baseData);
  var replace = !!opts.replace;
  saveTimer = setTimeout(function(){
    sb.from("mission_weeks").select("data").eq("week_start", savedWeek).maybeSingle()
      .then(function(got){
        var remote = (!got.error && got.data && got.data.data) ? got.data.data : null;
        var merged = (!replace && remote != null) ? mergeThree(baseSnap, snapshot, remote) : snapshot;
        return sb.from("mission_weeks").upsert({
          week_start: savedWeek, data: merged,
          updated_at: new Date().toISOString(), updated_by: myEmail
        }, {onConflict:"week_start"}).then(function(r){
          if(r.error){
            pending = false;
            setSync("저장 실패: " + r.error.message);
            return;
          }
          if(savedWeek === weekKey()){
            data = merged;
            setBase();
            cacheLocal();
            render();
          } else {
            try{ localStorage.setItem("mission:"+savedWeek, JSON.stringify(merged)); }catch(e){}
          }
          setSync(got.error ? "저장됨 · 상대 최신값 합치기 실패" : "저장됨 ✔");
          clearPendingSoon();
        });
      })
      .catch(function(e){
        pending = false;
        setSync("저장 실패: " + ((e && e.message) || "연결할 수 없습니다"));
      });
  }, 600);
}
function setSync(msg){ var el=document.getElementById("sync"); if(el) el.textContent = msg; }

/* ============ 픽셀 아바타 ============ */
function avatar(skin, size){
  var S = skin.skin || skin;
  var map = [
    "hhhhhhhh",
    "hhhhhhhh",
    "hssssssh",
    "seesseess".slice(0,8),
    "ssssssss",
    "sssmmsss",
    "ssssssss",
    "cccccccc"
  ];
  var col = {h:S.hair, s:"#e4b08a", e:"#3a2a1c", m:"#a86a55", c:S.shirt};
  var px = 1, out = '<svg viewBox="0 0 8 8" width="'+size+'" height="'+size+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">';
  for(var y=0;y<8;y++) for(var x=0;x<8;x++){
    var ch = map[y][x] || "s";
    out += '<rect x="'+x+'" y="'+y+'" width="'+px+'" height="'+px+'" fill="'+(col[ch]||col.s)+'"/>';
  }
  out += '<rect x="0" y="0" width="8" height="8" fill="none" stroke="#1d1a15" stroke-width="0.4"/></svg>';
  return out;
}

function weekStats(kid){
  var bad = 0, doneDays = 0, checkedDays = 0, reqDone = 0, reqTotal = 0;
  for(var i=0;i<7;i++){
    var d = addDays(weekStart,i), c = cell(kid.id, fmt(d));
    HABITS.forEach(function(h){ if(c.h[h.id]==="no") bad++; });
    var st = dayStatus(kid,d);
    if(st.n>0) checkedDays++;
    if(st.total && st.n>=st.total) doneDays++;
    reqDone += st.n; reqTotal += st.total;
  }
  var deduct = bad*PENALTY;
  var remain = Math.max(0, BASE_MIN - deduct);
  var weekly = weeklyItems(kid).map(function(it){
    var n=0; for(var i=0;i<7;i++){ if(cell(kid.id,fmt(addDays(weekStart,i))).t[it.id]) n++; }
    return {label:it.label, n:n, target:it.weekly, ok:n>=it.weekly};
  });
  var wkOk = weekly.every(function(it){ return it.ok; });
  var used = (meta(kid.id).used) || 0;
  var left = Math.max(0, remain - used);
  var playOk = doneDays>=checkedDays && checkedDays>0 && wkOk;
  return {
    bad:bad, deduct:deduct, remain:remain, used:used, left:left,
    doneDays:doneDays, checkedDays:checkedDays, reqDone:reqDone, reqTotal:reqTotal,
    pct: reqTotal ? Math.round(reqDone/reqTotal*100) : 0,
    weekly:weekly, wkOk:wkOk, playOk:playOk
  };
}

  var ctrl = document.createElement("div");
  ctrl.className = "usebtns";
  var bUse = document.createElement("button");
  bUse.textContent = "🎮 30분 사용";
  bUse.onclick = function(){ mt.used = Math.min(BASE_MIN, used + PENALTY); save(); render(); };

/* ============ 서버 동기화 ============ */
function pull(){
  if(!sb || !allowed) return;
  setSync("불러오는 중…");
  sb.from("mission_weeks").select("data").eq("week_start", weekKey()).maybeSingle()
    .then(function(r){
      if(r.error){ setSync("불러오기 실패: " + r.error.message); return; }
      if(r.data && r.data.data){
        data = r.data.data;
        cacheLocal();
        render();
      }
      setBase();
      setSync("동기화됨 ✔");
    })
    .catch(function(e){
      setSync("불러오기 실패: " + ((e && e.message) || "연결할 수 없습니다"));
    });
}
function subscribe(){
  if(chan){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
  chan = sb.channel("mission-sync")
    .on("postgres_changes", {event:"*", schema:"public", table:"mission_weeks"}, function(p){
      var row = p["new"];
      if(!row || row.week_start !== weekKey()) return;
      if(pending) return;
      data = row.data || {};
      setBase();
      cacheLocal(); render();
      setSync("상대방 변경 반영됨 ✔");
    })
    .subscribe();
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && allowed) pull();
});


/* ============ 로그인 (Supabase Auth) ============ */
function gmsg(t, ok){
  var p = document.getElementById("gerr");
  p.style.color = ok ? "var(--grass)" : "var(--red)";
  p.textContent = t || "";
}
function showGate(){
  document.getElementById("gate").style.display = "flex";
  document.body.style.overflow = "hidden";
}
function hideGate(){
  document.getElementById("gate").style.display = "none";
  document.body.style.overflow = "";
}
function krErr(m){
  m = m || "";
  if(/Invalid login/i.test(m)) return "이메일 또는 비밀번호가 올바르지 않습니다";
  if(/already registered|User already/i.test(m)) return "이미 가입된 이메일입니다. 로그인하세요";
  if(/at least 6|Password should be/i.test(m)) return "비밀번호는 6자 이상이어야 합니다";
  if(/Email not confirmed/i.test(m)) return "메일 인증이 아직 안 됐습니다. 받은 메일의 링크를 눌러주세요";
  if(/valid email|Unable to validate/i.test(m)) return "이메일 형식을 확인해 주세요";
  return m;
}
function creds(){
  return {
    email: document.getElementById("gid").value.trim(),
    password: document.getElementById("gpw").value
  };
}
function doLogin(){
  if(!sb){ gmsg("설정이 필요합니다"); return; }
  var c = creds();
  if(!c.email || !c.password){ gmsg("이메일과 비밀번호를 입력하세요"); return; }
  gmsg("로그인 중…", true);
  sb.auth.signInWithPassword(c).then(function(r){
    if(r.error) gmsg(krErr(r.error.message));
    else document.getElementById("gpw").value = "";
  }).catch(function(e){
    gmsg(krErr((e && e.message) || "연결할 수 없습니다"));
  });
}
function doSignup(){
  if(!sb){ gmsg("설정이 필요합니다"); return; }
  var c = creds();
  if(!c.email || !c.password){ gmsg("이메일과 비밀번호를 입력하세요"); return; }
  gmsg("가입 중…", true);
  sb.auth.signUp(c).then(function(r){
    if(r.error){ gmsg(krErr(r.error.message)); return; }
    if(r.data && r.data.session) gmsg("가입 완료!", true);
    else gmsg("확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인하세요.", true);
  }).catch(function(e){
    gmsg(krErr((e && e.message) || "연결할 수 없습니다"));
  });
}
function enterApp(){
  gmsg("");
  hideGate();
  document.getElementById("who").textContent = myEmail;
  loadLocal(); render();
  pull();
  subscribe();
}
function enterOffline(msg){
  myEmail = lastAllowed();
  allowed = !!myEmail;
  hideGate();
  document.getElementById("who").textContent = myEmail;
  loadLocal(); render();
  setSync(msg || "저장 실패: 연결할 수 없습니다");
}
function onSession(sess){
  var gen = ++sessionGen;
  if(!sess){
    myEmail = ""; allowed = false;
    if(chan && sb){ try{ sb.removeChannel(chan); }catch(e){} chan = null; }
    document.getElementById("who").textContent = "";
    setSync("로그인이 필요합니다");
    showGate();
    return;
  }
  myEmail = sess.user.email;
  sb.from("allowed_users").select("email").eq("email", myEmail).maybeSingle().then(function(r){
    if(gen !== sessionGen) return;
    if(r.error){
      if(lastAllowed() === myEmail){
        allowed = true;
        enterApp();
        setSync("불러오기 실패: " + r.error.message);
        return;
      }
      showGate();
      gmsg("허용 여부를 확인할 수 없습니다.\n" + r.error.message);
      setSync("저장 실패: " + r.error.message);
      return;
    }
    if(!r.data){
      allowed = false;
      rememberAllowed("");
      showGate();
      gmsg("이 계정은 아직 승인되지 않았습니다");
      setSync("승인되지 않은 계정");
      return;
    }
    allowed = true;
    rememberAllowed(myEmail);
    enterApp();
  }).catch(function(e){
    if(gen !== sessionGen) return;
    if(lastAllowed() === myEmail){
      allowed = true;
      enterApp();
    } else {
      showGate();
    }
    setSync("저장 실패: " + ((e && e.message) || "연결할 수 없습니다"));
  });
}
document.getElementById("gbtn").onclick = doLogin;
document.getElementById("gsignup").onclick = doSignup;
["gid","gpw"].forEach(function(k){
  document.getElementById(k).addEventListener("keydown", function(e){
    if(e.key === "Enter") doLogin();
  });
});
document.getElementById("logoutBtn").onclick = function(){
  rememberAllowed("");
  if(sb) sb.auth.signOut();
  else {
    myEmail = ""; allowed = false;
    document.getElementById("who").textContent = "";
    showGate();
    setSync("로그인이 필요합니다");
  }
};

/* ============ 시작 ============ */
loadLocal();
render();
showGate();

if(!isConfigured()){
  gmsg("설정이 필요합니다.\n파일 위쪽의 SUPABASE_URL 과 SUPABASE_ANON_KEY 를 채워주세요.");
  setSync("설정 필요");
} else if(!window.supabase){
  gmsg("Supabase 라이브러리를 불러오지 못했습니다.\n인터넷 연결을 확인하고 새로고침하세요.");
  enterOffline("저장 실패: 연결할 수 없습니다");
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  setSync("확인 중…");
  sb.auth.onAuthStateChange(function(_e, sess){ onSession(sess); });
}
})();
</script>
</body>
